name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  # The Settings app is a WPF program, so it is compiled on Windows. Everything else builds
  # on Linux, and the two meet in the release job.
  settings-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build and self-test the Settings app
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-settings.ps1 -Out out/settings -SelfTest

      - uses: actions/upload-artifact@v4
        with:
          name: settings-app
          path: out/settings/Bitwarden-MCP-Settings.exe
          if-no-files-found: error

  release:
    needs: settings-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      # A release that has not passed its own tests is worse than no release: this server holds
      # the keys to a password vault.
      - name: Test
        run: npm test

      - uses: actions/download-artifact@v4
        with:
          name: settings-app
          path: dist/settings

      - name: Package
        run: npm run pack

      - name: Check the version matches the tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Check the bundle carries the Settings app
        run: unzip -l out/*.mcpb | grep -q 'dist/settings/Bitwarden-MCP-Settings.exe'

      # The notes are the matching section of the changelog, so the release page and the file in
      # the repository cannot drift.
      - name: Extract the changelog section
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for what changed in $TAG." > release-notes.md
          fi
          cat release-notes.md

      - name: Checksums
        run: |
          cp dist/settings/Bitwarden-MCP-Settings.exe out/
          cd out && sha256sum *.mcpb Bitwarden-MCP-Settings.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" out/*.mcpb out/Bitwarden-MCP-Settings.exe out/SHA256SUMS.txt \
            --title "Bitwarden MCP $TAG" \
            --notes-file release-notes.md
