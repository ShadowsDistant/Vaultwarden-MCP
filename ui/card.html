<title>Vault</title>
<style>
  /* Host-provided variables win; the fallbacks approximate a typical host palette so the card
     still looks right in a host that sends none. The third layer handles a host that sets a
     theme but no variables. */
  :root {
    --bg: var(--color-background-primary, #faf9f5);
    --bg2: var(--color-background-secondary, #f0eee6);
    --bg3: var(--color-background-tertiary, #e8e6dc);
    --fg: var(--color-text-primary, #141413);
    --muted: var(--color-text-secondary, #6b6a66);
    --faint: var(--color-text-tertiary, #9b9a94);
    --line: var(--color-border-primary, #e3e1d8);
    --line2: var(--color-border-secondary, #eeece4);
    --danger: var(--color-text-danger, #b3261e);
    --danger-bg: rgba(179, 38, 30, .10);
    --success: var(--color-text-success, #1f7a4d);
    --warn: var(--color-text-warning, #9a6212);

    --accent: #2f6fe0;
    --accent-fg: #ffffff;
    --accent-soft: rgba(47, 111, 224, .12);
    --accent-line: rgba(47, 111, 224, .28);

    --radius: var(--border-radius-xl, 14px);
    --radius-md: var(--border-radius-lg, 10px);
    --radius-sm: var(--border-radius-md, 7px);
    --shadow: var(--shadow-sm, 0 1px 2px rgba(0, 0, 0, .06), 0 4px 14px rgba(0, 0, 0, .05));
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --mono: var(--font-mono, ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace);
    color-scheme: light dark;
  }

  /* Once the host has told us its theme, commit to it. Left at `light dark`, the browser
     paints the frame's canvas from the OS preference, so a light host on a dark desktop
     shows a dark band around the card. */
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #262624);
    --bg2: var(--color-background-secondary, #30302e);
    --bg3: var(--color-background-tertiary, #3a3a37);
    --fg: var(--color-text-primary, #f5f4ef);
    --muted: var(--color-text-secondary, #b0aea6);
    --faint: var(--color-text-tertiary, #86847d);
    --line: var(--color-border-primary, #403f3c);
    --line2: var(--color-border-secondary, #373734);
    --danger: var(--color-text-danger, #f08b82);
    --danger-bg: rgba(240, 139, 130, .14);
    --success: var(--color-text-success, #6bce9c);
    --warn: var(--color-text-warning, #e0b464);
    --accent: #6ea8ff;
    --accent-fg: #10233f;
    --accent-soft: rgba(110, 168, 255, .16);
    --accent-line: rgba(110, 168, 255, .34);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #262624);
      --bg2: var(--color-background-secondary, #30302e);
      --bg3: var(--color-background-tertiary, #3a3a37);
      --fg: var(--color-text-primary, #f5f4ef);
      --muted: var(--color-text-secondary, #b0aea6);
      --faint: var(--color-text-tertiary, #86847d);
      --line: var(--color-border-primary, #403f3c);
      --line2: var(--color-border-secondary, #373734);
      --danger: var(--color-text-danger, #f08b82);
      --danger-bg: rgba(240, 139, 130, .14);
      --success: var(--color-text-success, #6bce9c);
      --warn: var(--color-text-warning, #e0b464);
      --accent: #6ea8ff;
      --accent-fg: #10233f;
      --accent-soft: rgba(110, 168, 255, .16);
      --accent-line: rgba(110, 168, 255, .34);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    /* The host paints its own surface behind the frame; the card floats on it. */
    background: transparent;
    font-family: var(--font);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    max-width: 560px;
  }

  /* ---- working state ----
     Every button here ends in a call to the Bitwarden CLI, which spawns a process and can take
     several seconds. The button that was pressed says what it is doing ("Unlocking…"); a call
     that runs past a moment also gets a thin bar along the card's top edge. Nothing spins. */
  .progress {
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    overflow: hidden; pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity .14s ease-out;
  }
  .card.busy .progress { opacity: 1; transition-delay: .3s; }
  .progress > span {
    position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
    background: var(--accent);
    animation: progress-slide 1.3s cubic-bezier(.4, 0, .2, 1) infinite;
  }
  @keyframes progress-slide { from { left: -40%; } to { left: 100%; } }

  .pad { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- header ---- */
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line2);
  }
  .mark { width: 20px; height: 20px; flex: none; color: var(--accent); }
  .head-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .head-sub { font-size: 11.5px; color: var(--muted); }

  /* The vault's state, as words. No badge, no coloured dot: a label next to the title. */
  .state {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    white-space: nowrap; flex: none;
  }
  .state svg { width: 14px; height: 14px; }
  .state.problem { color: var(--danger); }
  .tag { font-size: 11.5px; color: var(--muted); white-space: nowrap; flex: none; }

  /* ---- item identity ----
     A neutral tile that holds the site's own icon, or the item's initial when there is none. */
  .avatar {
    width: 32px; height: 32px; flex: none;
    border-radius: 8px;
    background: var(--bg2);
    color: var(--muted);
    display: grid; place-items: center;
    font-size: 14px; font-weight: 600;
    border: 1px solid var(--line);
  }
  .name { font-size: 15px; font-weight: 600; letter-spacing: -0.012em; line-height: 1.25; }
  .sub { font-size: 12px; color: var(--muted); }

  /* ---- field rows ---- */
  .fields { display: flex; flex-direction: column; }
  .field {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    border-top: 1px solid var(--line2);
    min-height: 44px;
  }
  .field-label {
    font-size: 11px; color: var(--faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
    width: 74px; flex: none;
  }
  .field-value { font-size: 13px; color: var(--fg); min-width: 0; }
  .field-value.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: .01em; }
  .field-value.empty { color: var(--faint); }
  .field-actions { display: flex; gap: 3px; margin-left: auto; flex: none; }

  .dots { letter-spacing: .08em; color: var(--muted); font-size: 13px; }

  /* ---- buttons ---- */
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .icon-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    padding: 0;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .icon-btn:hover { background: var(--bg2); color: var(--fg); border-color: var(--line); }
  .icon-btn.on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .icon-btn svg { width: 16px; height: 16px; display: block; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--fg);
    font-size: 12.5px; font-weight: 500;
    transition: background .12s ease, border-color .12s ease, opacity .12s ease;
  }
  .btn:hover { background: var(--bg3); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); font-weight: 600; }
  .btn.primary:hover { opacity: .9; background: var(--accent); }
  .btn.danger { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.danger:hover { opacity: .9; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--bg2); color: var(--fg); }
  .btn[disabled] { opacity: .62; pointer-events: none; }
  /* The button that is doing the work stays at full strength, so its "Saving…" reads clearly;
     only the rest of the card steps back. */
  .btn.is-busy { opacity: 1; cursor: progress; }
  .btn svg { width: 16px; height: 16px; }

  /* ---- update banner ---- */
  .update-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 14px; font-size: 12px; line-height: 1.4;
    background: var(--accent-soft); color: var(--fg);
    border-bottom: 1px solid var(--accent-line);
  }
  .update-bar.fresh { animation: fade .14s ease-out both; }
  .update-bar > svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
  .update-bar .update-text { flex: 1; min-width: 0; }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; }

  /* A pressed icon button keeps its icon and is simply held down until its call returns. */
  .icon-btn.working { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); cursor: progress; }

  /* While anything is in flight the card stops accepting input, so a second impatient click
     cannot queue a duplicate. The buttons keep their own colour; only the body dims. */
  .card.busy .fields,
  .card.busy .list,
  .card.busy .form,
  .card.busy .diff { opacity: .55; pointer-events: none; transition: opacity .12s ease-out; }
  .card.busy { cursor: progress; }

  .actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line2); }
  .actions .spacer { flex: 1; }

  /* ---- list ---- */
  .list { display: flex; flex-direction: column; max-height: 340px; overflow-y: auto; }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    border-top: 1px solid var(--line2);
    background: transparent;
    border-left: 0; border-right: 0; border-bottom: 0;
    text-align: left;
    width: 100%;
    color: inherit;
    transition: background .1s ease;
  }
  .list-row:hover { background: var(--bg2); }
  /* The header already draws the line above the first row. */
  .list-row:first-child { border-top: 0; }
  .list-avatar {
    width: 24px; height: 24px; flex: none; border-radius: 6px;
    background: var(--bg2); color: var(--muted);
    display: grid; place-items: center; font-size: 11px; font-weight: 600;
    border: 1px solid var(--line);
  }
  /* The site icon sits over the initial rather than instead of it, so a request that fails —
     offline, no icon for that domain, icons switched off on the instance — leaves the letter
     showing rather than a broken-image mark. It only becomes visible once it has loaded. */
  .avatar, .list-avatar { position: relative; overflow: hidden; }
  .favicon {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 16%;
    background: var(--bg2);
    opacity: 0;
    transition: opacity .14s ease-out;
  }
  .favicon.shown { opacity: 1; }

  .list-name { font-size: 13px; font-weight: 500; }
  .list-sub { font-size: 11.5px; color: var(--faint); }
  .chev { color: var(--faint); flex: none; }
  .chev svg { width: 14px; height: 14px; display: block; }

  /* ---- forms ---- */
  .form { display: flex; flex-direction: column; gap: 11px; padding: 14px 16px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  input[type="text"], input[type="password"], select, textarea {
    font-family: inherit; font-size: 13px;
    color: var(--fg);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    width: 100%;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 56px; }
  .secret-input { display: flex; gap: 6px; align-items: center; }
  .secret-input input { font-family: var(--mono); letter-spacing: .01em; }

  /* ---- strength meter ---- */
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter-track { flex: 1; height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: 2px; transition: width .14s ease-out, background .14s ease-out; }
  .meter-label { font-size: 11px; color: var(--muted); font-weight: 500; min-width: 66px; text-align: right; }

  /* ---- confirm ---- */
  .diff { display: flex; flex-direction: column; }
  .diff-row { display: flex; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line2); align-items: baseline; }
  .diff-label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; width: 74px; flex: none; }
  .diff-vals { font-size: 12.5px; min-width: 0; }
  .diff-before { color: var(--faint); text-decoration: line-through; }
  .diff-arrow { color: var(--faint); margin: 0 6px; }
  .diff-after { color: var(--fg); font-weight: 500; }

  .note {
    font-size: 12px; color: var(--muted); line-height: 1.45;
    padding: 10px 16px; background: var(--bg2); border-top: 1px solid var(--line2);
  }
  .note.warn { background: var(--danger-bg); color: var(--danger); }

  .banner {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12px; line-height: 1.45;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-top: 1px solid var(--accent-line);
    color: var(--fg);
  }
  .banner svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
  .lead { display: flex; align-items: center; gap: 8px; }
  .lead svg { width: 16px; height: 16px; flex: none; color: var(--muted); }
  .sub.danger { color: var(--danger); }

  .empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---- totp ---- */
  .totp { display: flex; align-items: center; gap: 8px; }
  .totp-code { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; font-weight: 600; }
  .totp-left { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- skeleton: still placeholders, no shimmer ---- */
  .sk { background: var(--bg3); border-radius: 4px; height: 10px; opacity: .6; }

  .fade-in { animation: fade .14s ease-out both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* Motion is declared unconditionally above and suppressed here, in one place. The user's
     choice in the Settings app arrives as data-motion: "on" keeps it even when the operating
     system asks for reduced motion, "off" removes it everywhere. With motion off the progress
     bar stops sliding and becomes a still tint along the top edge, so a slow call still shows. */
  @media (prefers-reduced-motion: reduce) {
    :root:not([data-motion="on"]) *,
    :root:not([data-motion="on"]) *::before,
    :root:not([data-motion="on"]) *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    :root:not([data-motion="on"]) .progress > span { animation: none !important; left: 0; width: 100%; opacity: .5; }
  }
  :root[data-motion="off"] *,
  :root[data-motion="off"] *::before,
  :root[data-motion="off"] *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  :root[data-motion="off"] .progress > span { animation: none !important; left: 0; width: 100%; opacity: .5; }

  @media (max-width: 420px) {
    .field-label, .diff-label { width: 62px; }
    .actions { flex-wrap: wrap; }
  }

  [hidden] { display: none !important; }
</style>

<div class="card" id="card">
  <div class="progress" aria-hidden="true"><span></span></div>
  <div id="body"></div>
</div>

<script>/*__BUNDLE__*/</script>
