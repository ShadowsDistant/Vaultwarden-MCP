<title>Vault</title>
<style>
  /* Host-provided variables win; the fallbacks approximate Claude's own palette so the card
     still looks right in a host that sends none. The third layer handles a host that sets a
     theme but no variables. */
  :root {
    --bg: var(--color-background-primary, #faf9f5);
    --bg2: var(--color-background-secondary, #f0eee6);
    --bg3: var(--color-background-tertiary, #e8e6dc);
    --fg: var(--color-text-primary, #141413);
    --muted: var(--color-text-secondary, #6b6a66);
    --faint: var(--color-text-tertiary, #9b9a94);
    --line: var(--color-border-primary, #e3e1d8);
    --line2: var(--color-border-secondary, #eeece4);
    --danger: var(--color-text-danger, #b3261e);
    --danger-bg: rgba(179, 38, 30, .10);
    --success: var(--color-text-success, #1f7a4d);
    --warn: var(--color-text-warning, #9a6212);

    --accent: #2f6fe0;
    --accent-fg: #ffffff;
    --accent-soft: rgba(47, 111, 224, .12);
    --accent-line: rgba(47, 111, 224, .28);

    --radius: var(--border-radius-xl, 14px);
    --radius-md: var(--border-radius-lg, 10px);
    --radius-sm: var(--border-radius-md, 7px);
    --shadow: var(--shadow-sm, 0 1px 2px rgba(0, 0, 0, .06), 0 4px 14px rgba(0, 0, 0, .05));
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
    --mono: var(--font-mono, ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace);
    color-scheme: light dark;
  }

  /* Once the host has told us its theme, commit to it. Left at `light dark`, the browser
     paints the frame's canvas from the OS preference, so a light host on a dark desktop
     shows a dark band around the card. */
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }

  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #262624);
    --bg2: var(--color-background-secondary, #30302e);
    --bg3: var(--color-background-tertiary, #3a3a37);
    --fg: var(--color-text-primary, #f5f4ef);
    --muted: var(--color-text-secondary, #b0aea6);
    --faint: var(--color-text-tertiary, #86847d);
    --line: var(--color-border-primary, #403f3c);
    --line2: var(--color-border-secondary, #373734);
    --danger: var(--color-text-danger, #f08b82);
    --danger-bg: rgba(240, 139, 130, .14);
    --success: var(--color-text-success, #6bce9c);
    --warn: var(--color-text-warning, #e0b464);
    --accent: #6ea8ff;
    --accent-fg: #10233f;
    --accent-soft: rgba(110, 168, 255, .16);
    --accent-line: rgba(110, 168, 255, .34);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-background-primary, #262624);
      --bg2: var(--color-background-secondary, #30302e);
      --bg3: var(--color-background-tertiary, #3a3a37);
      --fg: var(--color-text-primary, #f5f4ef);
      --muted: var(--color-text-secondary, #b0aea6);
      --faint: var(--color-text-tertiary, #86847d);
      --line: var(--color-border-primary, #403f3c);
      --line2: var(--color-border-secondary, #373734);
      --danger: var(--color-text-danger, #f08b82);
      --danger-bg: rgba(240, 139, 130, .14);
      --success: var(--color-text-success, #6bce9c);
      --warn: var(--color-text-warning, #e0b464);
      --accent: #6ea8ff;
      --accent-fg: #10233f;
      --accent-soft: rgba(110, 168, 255, .16);
      --accent-line: rgba(110, 168, 255, .34);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    /* The host paints its own surface behind the frame; the card floats on it. */
    background: transparent;
    font-family: var(--font);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    max-width: 560px;
  }

  .pad { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .grow { flex: 1; min-width: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- header ---- */
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line2);
  }
  .mark { width: 22px; height: 22px; flex: none; border-radius: 6px; }
  .head-title { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .head-sub { font-size: 11.5px; color: var(--faint); }

  .pill {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg3);
    color: var(--muted);
    white-space: nowrap;
  }
  .pill.ok { background: rgba(31, 122, 77, .14); color: var(--success); }
  .pill.warn { background: rgba(154, 98, 18, .14); color: var(--warn); }
  .pill.off { background: var(--danger-bg); color: var(--danger); }

  /* ---- item identity ---- */
  .avatar {
    width: 40px; height: 40px; flex: none;
    border-radius: 11px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    font-size: 17px; font-weight: 600;
    border: 1px solid var(--accent-line);
  }
  .name { font-size: 15px; font-weight: 600; letter-spacing: -0.012em; line-height: 1.25; }
  .sub { font-size: 12px; color: var(--muted); }

  /* ---- field rows ---- */
  .fields { display: flex; flex-direction: column; }
  .field {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    border-top: 1px solid var(--line2);
    min-height: 44px;
  }
  .field-label {
    font-size: 11px; color: var(--faint);
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600;
    width: 74px; flex: none;
  }
  .field-value { font-size: 13px; color: var(--fg); min-width: 0; }
  .field-value.mono { font-family: var(--mono); font-size: 12.5px; letter-spacing: .01em; }
  .field-value.empty { color: var(--faint); }
  .field-actions { display: flex; gap: 3px; margin-left: auto; flex: none; }

  .dots { letter-spacing: .16em; color: var(--muted); font-size: 13px; }

  /* ---- buttons ---- */
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .icon-btn {
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    padding: 0;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .icon-btn:hover { background: var(--bg2); color: var(--fg); border-color: var(--line); }
  .icon-btn.on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
  .icon-btn svg { width: 15px; height: 15px; display: block; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--fg);
    font-size: 12.5px; font-weight: 500;
    transition: background .12s ease, border-color .12s ease, opacity .12s ease;
  }
  .btn:hover { background: var(--bg3); }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); font-weight: 600; }
  .btn.primary:hover { opacity: .9; background: var(--accent); }
  .btn.danger { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
  .btn.danger:hover { opacity: .9; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--bg2); color: var(--fg); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn svg { width: 14px; height: 14px; }

  .actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line2); }
  .actions .spacer { flex: 1; }

  /* ---- list ---- */
  .list { display: flex; flex-direction: column; max-height: 340px; overflow-y: auto; }
  .list-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px;
    border-top: 1px solid var(--line2);
    background: transparent;
    border-left: 0; border-right: 0; border-bottom: 0;
    text-align: left;
    width: 100%;
    color: inherit;
    transition: background .1s ease;
  }
  .list-row:hover { background: var(--bg2); }
  .list-avatar {
    width: 28px; height: 28px; flex: none; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 12px; font-weight: 600;
    border: 1px solid var(--accent-line);
  }
  .list-name { font-size: 13px; font-weight: 500; }
  .list-sub { font-size: 11.5px; color: var(--faint); }
  .chev { color: var(--faint); flex: none; }
  .chev svg { width: 14px; height: 14px; display: block; }

  /* ---- forms ---- */
  .form { display: flex; flex-direction: column; gap: 11px; padding: 14px 16px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  input[type="text"], input[type="password"], select, textarea {
    font-family: inherit; font-size: 13px;
    color: var(--fg);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    width: 100%;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: vertical; min-height: 56px; }
  .secret-input { display: flex; gap: 6px; align-items: center; }
  .secret-input input { font-family: var(--mono); letter-spacing: .01em; }

  /* ---- strength meter ---- */
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter-track { flex: 1; height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; }
  .meter-fill { height: 100%; width: 0; border-radius: 2px; transition: width .2s ease, background .2s ease; }
  .meter-label { font-size: 11px; color: var(--muted); font-weight: 500; min-width: 66px; text-align: right; }

  /* ---- confirm ---- */
  .diff { display: flex; flex-direction: column; }
  .diff-row { display: flex; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line2); align-items: baseline; }
  .diff-label { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; width: 74px; flex: none; }
  .diff-vals { font-size: 12.5px; min-width: 0; }
  .diff-before { color: var(--faint); text-decoration: line-through; }
  .diff-arrow { color: var(--faint); margin: 0 6px; }
  .diff-after { color: var(--fg); font-weight: 500; }

  .note {
    font-size: 12px; color: var(--muted); line-height: 1.45;
    padding: 10px 16px; background: var(--bg2); border-top: 1px solid var(--line2);
  }
  .note.warn { background: var(--danger-bg); color: var(--danger); }

  .banner {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 12px; line-height: 1.45;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-top: 1px solid var(--accent-line);
    color: var(--fg);
  }
  .banner svg { width: 14px; height: 14px; flex: none; margin-top: 1px; color: var(--accent); }

  .empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---- totp ---- */
  .totp { display: flex; align-items: center; gap: 8px; }
  .totp-code { font-family: var(--mono); font-size: 15px; letter-spacing: .12em; font-weight: 600; }
  .ring { width: 18px; height: 18px; flex: none; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2.5; }
  .ring .track { stroke: var(--bg3); }
  .ring .head { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .95s linear; }

  /* ---- skeleton ---- */
  .sk { background: var(--bg3); border-radius: 5px; height: 10px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: .85; } }

  .fade-in { animation: fade .18s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  @media (max-width: 420px) {
    .field-label, .diff-label { width: 62px; }
    .actions { flex-wrap: wrap; }
  }

  [hidden] { display: none !important; }
</style>

<div class="card" id="card">
  <div id="body"></div>
</div>

<script>/*__BUNDLE__*/</script>
